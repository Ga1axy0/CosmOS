[package]
name = "os"
version = "0.1.0"
authors = ["Yifan Wu <shinbokuow@163.com>"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
riscv = { path = "../vendor/riscv", features = ["inline-asm"] }
lazy_static = { version = "1.4.0", features = ["spin_no_std"] }
# Keep release hot paths free of disabled trace/debug/info formatting while
# retaining warnings and errors for production diagnostics.
log = { version = "0.4", features = ["release_max_level_warn"] }
bitflags = "1.2.1"
xmas-elf = "0.7.0"
virtio-drivers = "0.12.0"
simple-ahci = { version = "0.1.1-preview.1", optional = true }
# fs = { path = "../fs" }
fs = { path = "../fs", default-features = false, features = ["io_perf_counters", "kernel_sleep_mutex"] }
hashbrown = "0.12.3"
smoltcp = { path = "../vendor/smoltcp", default-features = false, features = [
	"alloc",
	"medium-ethernet",
	"proto-ipv4",
	"proto-ipv6",
	"proto-ipv4-fragmentation",
	"socket-udp",
	"socket-tcp",
	"socket-dhcpv4",
	"iface-max-addr-count-4",
	"fragmentation-buffer-size-16384",
] }
strum_macros = "0.28.0"

[features]
fat32 = []
easyfs = []
ext4 = []
platform-qemu-virt = []
platform-ls2k1000-nebula = ["dep:simple-ahci"]
io_perf_counters = []
net_perf_counters = []
mm_perf_counters = []
oom_diagnostics = []
perf_probe = []
# Per-syscall invocation and dispatch-time counters exposed through
# /proc/syscalls_count.
syscalls_count = []
# Diagnostic-only getpid path used to bound generic trap/syscall overhead.
# It is never enabled by the normal build.
getpid_path_probe = []
# Assembly-only variants of the same diagnostic.  The first never enters the
# kernel page table; the second bounces user -> kernel -> user before restoring.
getpid_asm_probe = []
getpid_asm_satp_probe = []
# Publish the current task in a per-hart atomic pointer so read-side lookups do
# not acquire Processor's irq-disabling spinlock.
current_task_cache = []
# Cache process identity on top of current_task_cache.  This is kept separate
# while benchmarking so the cost of each lookup layer can be measured.
process_identity_cache = ["current_task_cache"]
# Lock-free hints for the common no-signal/no-reschedule/non-zombie return path.
return_work_cache = ["process_identity_cache"]
# Snapshot immutable-per-exec trap metadata on the TCB, avoiding repeated TCB
# and PCB locks in the common trap path.
trap_context_cache = ["return_work_cache"]
# Diagnostic-only bound for the per-trap process accounting and active-user
# address-space bookkeeping. Never enable in a production kernel.
trap_accounting_probe = ["return_work_cache"]
# Diagnostic-only bound for polling the global TLB-shootdown mailbox on every
# user trap. This is safe only for the controlled single-hart benchmark.
trap_tlb_poll_probe = ["trap_accounting_probe"]
# Diagnostic-only bound for the per-syscall interrupt-enable guard. This is
# safe only for a nonblocking syscall in the controlled benchmark.
trap_irq_guard_probe = ["trap_context_cache"]
# Diagnostic-only bound for the two stvec writes around the minimal Rust
# getppid probe. Other syscalls still install the kernel vector normally.
trap_stvec_probe = ["getpid_path_probe"]
# Diagnostic-only bound for the two active-user-hart mask updates nested in
# process accounting. Safe only when the benchmark does not edit page tables.
trap_active_harts_probe = ["trap_context_cache"]
# Diagnostic-only forced kernel fcsr clobber before syscall return. Used by
# fp_context_probe to prove that a full restore also writes an authoritative
# zero fcsr value; never enable in production.
trap_fp_fcsr_clobber_probe = ["trap_context_cache"]
legacy-vdb-names = []
sched_invariant_checks = []
kernel_trap_diagnostics = []
cosmos-meminfo = []
default = ["ext4", "platform-qemu-virt", "net_perf_counters", "mm_perf_counters", "legacy-vdb-names"]
